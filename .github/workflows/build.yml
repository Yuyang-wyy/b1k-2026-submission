name: build-policy-image
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - run: df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          cd docker
          docker build -t ghcr.io/yuyang-wyy/b1k-2026-comet:lb_v1 .
          docker push ghcr.io/yuyang-wyy/b1k-2026-comet:lb_v1
          docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/yuyang-wyy/b1k-2026-comet:lb_v1
